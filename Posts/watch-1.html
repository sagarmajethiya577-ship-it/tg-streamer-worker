<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Two Tone Watch No: 247 - OSTIN</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo">OSTIN</a>
        <button id="themeToggle" class="theme-switch">🌙 Dark</button>
    </header>
    <div class="post-container">
<img src="https://i.ibb.co/DH0gpcc6/55f11b8be8cc.jpg" style="width:100%; max-width:400px;"/>
<h1>Premium Two Tone Watch No: 247</h1>
<p>Price: ₹9,995</p>
<p>Description: Ye watch premium leather strap ke saath aati hai.</p>
<button>Buy Now</button>
</div>
    <footer class="site-footer">
        <p>© 2026 OSTIN | Premium Store</p>
    </footer>

    <script>
    // 1. THEME TOGGLE LOGIC
    const toggleBtn = document.getElementById('themeToggle');
    const htmlTag = document.documentElement;
    toggleBtn.addEventListener('click', () => {
        const theme = htmlTag.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        htmlTag.setAttribute('data-theme', theme);
        toggleBtn.innerHTML = theme === 'dark' ? "☀️ Light" : "🌙 Dark";
        localStorage.setItem('theme', theme);
    });
    if (localStorage.getItem('theme') === 'dark') {
        htmlTag.setAttribute('data-theme', 'dark');
        toggleBtn.innerHTML = "☀️ Light";
    }

    // 2. AUTO-SLIDE LOGIC (2 Seconds Interval)
    const sliders = document.querySelectorAll('.hero-slider');
    sliders.forEach(slider => {
        let isPaused = false;
        setInterval(() => {
            if (!isPaused) {
                const slides = slider.querySelectorAll('.slide');
                if (slides.length <= 1) return; 

                const slideWidth = slides[0].clientWidth;
                // Check if we are at the end
                if (slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 5) {
                    slider.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    slider.scrollBy({ left: slideWidth, behavior: 'smooth' });
                }
            }
        }, 3000);

        // Pause logic
        slider.addEventListener('touchstart', () => isPaused = true);
        slider.addEventListener('mousedown', () => isPaused = true);
        slider.addEventListener('touchend', () => setTimeout(() => isPaused = false, 4000));
        slider.addEventListener('mouseup', () => setTimeout(() => isPaused = false, 4000));
    });
    </script>

</body>
</html>
